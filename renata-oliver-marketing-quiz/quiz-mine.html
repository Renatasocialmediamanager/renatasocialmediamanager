    <style>
        /* Quiz-Specific Layout Tweaks */
        #quiz-container { 
            max-width: 850px; 
            margin: 40px auto; 
            padding: 0 20px; 
            text-align: left; 
        }
        
        .question { 
            margin-bottom: 50px !important; 
            background: #fafafa; 
            padding: 30px; 
            border-radius: 4px; 
            border-left: 5px solid #eee;
            transition: all 0.3s ease;
        }

        .q-title { 
            font-weight: bold; 
            font-size: 14px; 
            margin-bottom: 25px; 
            display: block; 
            letter-spacing: 1px; 
        }

        .question label { 
            display: flex !important; 
            align-items: center; 
            padding: 15px 20px !important; 
            margin: 10px 0 !important; 
            background: #fff; 
            border: 1px solid #eee; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 13px; 
        }

        .question label:hover { 
            background-color: #fdf2f6 !important; 
            border-color: #D470A2 !important; 
        }

        .question input { margin-right: 15px !important; }

        #submit-btn { 
            display: block; 
            width: 100%; 
            max-width: 350px; 
            margin: 40px auto; 
            background: #1a1a1a; 
            color: #fff; 
            padding: 22px; 
            border: none; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        
        #submit-btn:hover { background: #D470A2; }

        .score-box { 
            text-align: center; 
            padding: 50px; 
            background: #fdf2f6; 
            border: 1px solid #D470A2; 
            margin: 40px 0 80px 0; 
        }

        /* Dark Mode Support */
        body.dark-mode .question { background: #2a2a2a; color: #fff; border-color: #444; }
        body.dark-mode .question label { background: #333; border-color: #444; color: #eee; }
    </style>
</head>

<script>
    function setTheme(mode) {
        if (mode === 'dark') { document.body.classList.add('dark-mode'); } 
        else { document.body.classList.remove('dark-mode'); }
    }
    function setFont(size) {
        document.body.classList.remove('font-small', 'font-medium', 'font-large');
        document.body.classList.add('font-' + size);
    }
</script>
